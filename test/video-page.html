<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>视频课页面（模拟，用于悬浮窗与误报回归）</title>
</head>
<body>
  <h1>数据结构课程 - 第1章 绪论</h1>
  <div class="subject">2024、春季学期课程介绍：本课程主要内容包括数据结构与算法基础，请同学们认真学习第一章。</div>
  <div id="questionList">
    <div>常见问题</div>
    <div>Q1：怎么签到？</div>
    <div>A：点击签到按钮即可</div>
  </div>
  <div id="commentBox"><span>发表评论</span><textarea placeholder="请输入评论内容"></textarea></div>
  <div id="noteBox"><span>添加笔记</span><textarea placeholder="请输入笔记内容"></textarea></div>
  <div class="filter"><span>播放清晰度</span>
    <label><input type="radio" name="quality" value="ld">A、流畅</label>
    <label><input type="radio" name="quality" value="sd">B、高清</label>
    <label><input type="radio" name="quality" value="hd">C、原画</label>
  </div>
</body>
</html>
